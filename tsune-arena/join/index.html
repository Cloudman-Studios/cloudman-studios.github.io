<!doctype html>
<!-- Invite links land here (Discord only makes https links clickable) and go on to tsune://join/CODE, which opens the game. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join me in Tsune Arena!</title>
  <meta property="og:title" content="Join me in Tsune Arena!">
  <meta property="og:description" content="Click to open Tsune Arena and join my lobby.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://cloudmanstudio.com/img/logo.png">
  <meta name="theme-color" content="#4caf50">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(160deg, #3a3a3a, #000); color: #e8e8e8; font: 18px system-ui, sans-serif; text-align: center; }
    #code { font: bold 40px monospace; letter-spacing: 4px; margin: 16px 0; }
  </style>
</head>
<body>
  <main>
    <h1>Join me in Tsune Arena!</h1>
    <div id="code"></div>
    <p id="message">Opening Tsune Arena...</p>
  </main>
  <script>
    // Same rule as RelayConnection.LooksLikeJoinCode. The code only reaches the page through textContent.
    const code = (new URLSearchParams(location.search).get("code") || "").trim().toUpperCase();
    if (/^[6789BCDFGHJKLMNPQRTW]{6,12}$/.test(code)) {
      document.getElementById("code").textContent = code;
      document.getElementById("message").textContent =
        "Didn't open? Type " + code + " on the Play screen's JOIN CODE tab.";
      location.href = "tsune://join/" + code;
    } else {
      document.getElementById("message").textContent = "That invite link is broken.";
    }
  </script>
</body>
</html>
